name: Build & Release (Tauri)

on:
  push:
    tags:
      - 'local-v*'
      - 'cloud-v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform_name: macos-arm64
          - os: windows-latest
            platform_name: windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Select product source
        id: product
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" =~ ^(local|cloud)-v([0-9]+\.[0-9]+\.[0-9]+)(-build\.([2-9]|[1-9][0-9]+))?$ ]]; then
            PRODUCT="${BASH_REMATCH[1]}"
            VERSION="${BASH_REMATCH[2]}"
          else
            echo 'Invalid product release tag' >&2
            exit 1
          fi
          if [ "$PRODUCT" = local ]; then EDITION=Local; else EDITION=Cloud; fi
          echo "repository=wwjiang0328/Zimo-Agent-${EDITION}" >> "$GITHUB_OUTPUT"
          echo "edition=$EDITION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: ${{ steps.product.outputs.repository }}
          # Source and release repositories use the same immutable product tag.
          ref: refs/tags/${{ github.ref_name }}
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install --include=optional

      - name: Install all platform-specific native bindings
        run: node scripts/install-platform-bindings.mjs

      - name: Verify release version metadata
        env:
          RELEASE_VERSION: ${{ steps.product.outputs.version }}
        shell: bash
        run: node scripts/version-consistency.cjs "v${RELEASE_VERSION}"

      - name: Sync skills into bundle resources
        run: npm run sync-skills

      - name: Sync agent-browser sidecar
        run: npm run sync-agent-browser

      - name: Build Tauri app
        run: npm run tauri build

      - name: Rename artifacts
        shell: bash
        env:
          EDITION: ${{ steps.product.outputs.edition }}
          VERSION: ${{ steps.product.outputs.version }}
        run: |
          mkdir -p release_artifacts
          if [ "$RUNNER_OS" = macOS ]; then
            files=(src-tauri/target/release/bundle/dmg/*.dmg)
            destination="release_artifacts/Zimo-${EDITION}-mac-${VERSION}.dmg"
          else
            files=(src-tauri/target/release/bundle/nsis/*.exe)
            destination="release_artifacts/Zimo-${EDITION}-win-${VERSION}.exe"
          fi
          [ "${#files[@]}" -eq 1 ] && [ -f "${files[0]}" ] || exit 1
          cp "${files[0]}" "$destination"

      - name: Create or update release with renamed artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          EDITION: ${{ steps.product.outputs.edition }}
          RELEASE_VERSION: ${{ steps.product.outputs.version }}
        shell: bash
        run: |
          # Try to create release; if it already exists (other matrix job), just upload
          gh release create "$RELEASE_TAG" release_artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Zimo ${EDITION} ${RELEASE_VERSION}" \
            --notes "Official installers. Visit https://www.zimofy.com for product information and release notes." \
            --latest=false \
          || gh release upload "$RELEASE_TAG" release_artifacts/* \
            --repo "$GITHUB_REPOSITORY"
