name: Installer acceptance

on:
  workflow_dispatch:
    inputs:
      version:
        description: Local and Cloud release version
        required: true
        default: '2.1.0'
      build_revision:
        description: Immutable build revision (1 uses the original version tag)
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify installation, upgrade and product isolation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_REVISION: ${{ inputs.build_revision }}
        run: python scripts/installer-smoke.py
